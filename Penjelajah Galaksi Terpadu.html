<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Penjelajah Galaksi</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        :root {
            --primary: #00ffff;
            --danger: #ff3333;
            --coin: #ffd700;
            --bg-dark: #03030a;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            background: linear-gradient(to bottom, #010105 0%, #08081f 100%);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            flex-grow: 1;
        }

        /* UI Lapisan atas game */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 5;
            text-shadow: 0 0 5px #000;
        }

        .hud-left, .hud-right {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hud-right {
            align-items: flex-end;
        }

        .hud-stat {
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 14px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .text-coin { color: var(--coin); font-weight: bold; }
        .text-score { color: var(--primary); font-weight: bold; }

        /* Indikator Bar HP Pemain */
        .hp-bar-container {
            width: 100px;
            height: 12px;
            background: #222;
            border-radius: 6px;
            border: 1px solid #555;
            overflow: hidden;
            position: relative;
        }
        
        .hp-bar-fill {
            height: 100%;
            background: #00ff00;
            width: 100%;
            transition: width 0.2s, background-color 0.2s;
        }

        .hp-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 9px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 1px #000;
        }

        .active-boosts {
            font-size: 11px;
            color: #ff0;
            margin-top: 2px;
            text-shadow: 0 0 4px #ff0;
        }

        /* Tombol Kontrol Layar Sentuh */
        #virtual-controls {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }

        .d-pad {
            display: flex;
            gap: 15px;
        }

        .v-btn {
            width: 65px;
            height: 65px;
            background: rgba(0, 255, 255, 0.12);
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            color: #fff;
            backdrop-filter: blur(4px);
            transition: background 0.1s, transform 0.1s;
        }

        .v-btn:active, .v-btn.active {
            background: rgba(0, 255, 255, 0.45);
            transform: scale(0.92);
            box-shadow: 0 0 12px var(--primary);
        }

        #btn-shoot {
            background: rgba(255, 50, 50, 0.15);
            border-color: rgba(255, 50, 50, 0.4);
            width: 75px;
            height: 75px;
            font-size: 26px;
        }
        #btn-shoot:active, #btn-shoot.active {
            background: rgba(255, 50, 50, 0.45);
            box-shadow: 0 0 12px var(--danger);
        }

        /* Screen Styling (Menu, Toko, Game Over) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 12, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            transition: opacity 0.3s;
            backdrop-filter: blur(6px);
            z-index: 20;
            padding: 20px;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 10px 0;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 260px;
        }

        button.menu-btn {
            background: rgba(0, 255, 255, 0.1);
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 12px;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.2);
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button.menu-btn:hover, button.menu-btn:active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary);
        }

        /* Shop Container */
        .shop-container {
            width: 100%;
            max-width: 320px;
            height: 50vh;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #444;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .shop-item {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .skin-preview {
            width: 32px;
            height: 32px;
            clip-path: polygon(50% 0%, 100% 100%, 50% 80%, 0% 100%);
        }

        .shop-item-info {
            flex-grow: 1;
            margin-left: 12px;
        }

        .shop-item-name { font-size: 14px; font-weight: bold; }

        button.shop-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-buy { background: var(--coin); color: #000; }
        .btn-select { background: var(--primary); color: #000; }
        .btn-equipped { background: #444; color: #888; cursor: default; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- UI Permainan & Tombol Layar Sentuh -->
    <div id="ui-layer" class="hidden">
        <div class="hud">
            <div class="hud-left">
                <div class="hud-stat">
                    <span>❤️</span>
                    <div class="hp-bar-container">
                        <div id="hp-bar" class="hp-bar-fill"></div>
                        <div class="hp-text"><span id="hp-text">10</span>/10</div>
                    </div>
                </div>
                <div class="active-boosts" id="boosts-text"></div>
            </div>
            <div class="hud-right">
                <div class="hud-stat text-score">Skor: <span id="score-text">0</span></div>
                <div class="hud-stat text-coin">🪙 <span id="coin-text-hud">0</span></div>
            </div>
        </div>

        <!-- Tombol Layar Sentuh Sesuai Ketentuan -->
        <div id="virtual-controls">
            <div class="d-pad">
                <div id="btn-left" class="v-btn">◀</div>
                <div id="btn-right" class="v-btn">▶</div>
            </div>
            <div id="btn-shoot" class="v-btn">🔥</div>
        </div>
    </div>

    <!-- Menu Utama -->
    <div id="main-menu" class="screen">
        <h1>PENJELAJAH<br>GALAKSI</h1>
        <p class="subtitle">Gunakan tombol di layar atau keyboard.<br>Hindari alien dan jangan biarkan mereka lolos!</p>
        
        <div class="hud-stat text-coin" style="margin-bottom: 20px;">Koin Anda: 🪙 <span id="main-coin">0</span></div>
        
        <div class="btn-group">
            <button class="menu-btn" id="start-btn">Mulai Misi</button>
            <button class="menu-btn" id="shop-btn-main" style="border-color: var(--coin); color: var(--coin);">Toko Skin</button>
        </div>
    </div>

    <!-- Menu Toko (Shop) -->
    <div id="shop-menu" class="screen hidden">
        <h1>TOKO SKIN PESAWAT</h1>
        <div class="hud-stat text-coin" style="margin-bottom: 12px;">Koin Anda: 🪙 <span id="shop-coin">0</span></div>
        
        <div class="shop-container" id="shop-list"></div>

        <button class="menu-btn" id="shop-back-btn" style="width: 100%; max-width: 260px;">Kembali</button>
    </div>

    <!-- Layar Game Over -->
    <div id="game-over-menu" class="screen hidden">
        <h1 style="color: var(--danger); text-shadow: 0 0 15px var(--danger);">PESAWAT HANCUR</h1>
        <p class="subtitle" style="margin-bottom: 15px;">Misi pertahanan galaksi gagal.</p>
        
        <div class="hud-stat text-score" style="margin-bottom: 8px; font-size: 16px;">Skor Akhir: <span id="final-score">0</span></div>
        <div class="hud-stat text-coin" style="margin-bottom: 25px; font-size: 16px;">Koin Diperoleh: 🪙 +<span id="final-coins">0</span></div>

        <div class="btn-group">
            <button class="menu-btn" id="restart-btn">Coba Lagi</button>
            <button class="menu-btn" id="main-menu-btn" style="background: rgba(255,255,255,0.08); border-color:#888; color:#fff;">Menu Utama</button>
        </div>
    </div>
</div>

<script>
    // --- PENYIMPANAN DATA LOKAL (LocalStorage) ---
    const GameData = {
        getCoins: () => parseInt(localStorage.getItem('galaxyCoins')) || 0,
        addCoins: (amount) => {
            let c = GameData.getCoins() + amount;
            localStorage.setItem('galaxyCoins', c);
            return c;
        },
        getOwnedSkins: () => {
            let skins = localStorage.getItem('galaxySkins');
            return skins ? JSON.parse(skins) : ['biru'];
        },
        addSkin: (id) => {
            let skins = GameData.getOwnedSkins();
            if(!skins.includes(id)) {
                skins.push(id);
                localStorage.setItem('galaxySkins', JSON.stringify(skins));
            }
        },
        getEquippedSkin: () => localStorage.getItem('galaxyEquipped') || 'biru',
        setEquippedSkin: (id) => localStorage.setItem('galaxyEquipped', id)
    };

    const SKINS = {
        'biru': { name: 'Biru Standar', color: '#0088ff', price: 0 },
        'hijau': { name: 'Hijau Proton', color: '#00ff88', price: 40 },
        'merah': { name: 'Merah Plasma', color: '#ff3333', price: 90 },
        'emas': { name: 'Emas Galaksi', color: '#ffd700', price: 200 }
    };

    // --- SETUP KANVAS ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    function resize() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- VARIABEL PERMAINAN ---
    let gameState = 'MENU'; // MENU, PLAYING, SHOP, GAMEOVER
    let lastTime = 0;
    let animationId;
    
    let score = 0;
    let level = 1;
    let coinsCollectedSession = 0;
    let frameCount = 0;
    
    let player;
    let projectiles = [];
    let enemies = [];
    let particles = [];
    let collectibles = [];
    let stars = [];

    const controls = { left: false, right: false, shoot: false };

    // DOM UI Elements
    const uiLayer = document.getElementById('ui-layer');
    const mainMenu = document.getElementById('main-menu');
    const shopMenu = document.getElementById('shop-menu');
    const gameOverMenu = document.getElementById('game-over-menu');
    
    const textHp = document.getElementById('hp-text');
    const hpBar = document.getElementById('hp-bar');
    const textScore = document.getElementById('score-text');
    const textCoinHud = document.getElementById('coin-text-hud');
    const textBoosts = document.getElementById('boosts-text');

    // --- KELAS-KELAS ENTITAS ---

    class Star {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 0.5;
            this.speed = this.size * 12;
        }
        update(dt) {
            this.y += this.speed * (dt / 1000);
            if (this.y > canvas.height) {
                this.y = 0;
                this.x = Math.random() * canvas.width;
            }
        }
        draw() {
            ctx.fillStyle = `rgba(255, 255, 255, ${this.size/3})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
            ctx.fill();
        }
    }

    class Player {
        constructor() {
            this.radius = 18;
            this.x = canvas.width / 2;
            // POSISI Y: Diatur aman, berjarak dari bagian bawah layar agar tidak menempel rapat
            this.y = canvas.height - 140; 
            this.speed = 280;
            this.color = SKINS[GameData.getEquippedSkin()].color;
            
            this.maxHp = 10;
            this.hp = this.maxHp;
            
            this.lastShot = 0;
            this.baseFireRate = 280; // ms
            this.invulnerableTimer = 0;
            
            this.boosts = { rapid: 0, triple: 0 };
        }

        update(dt) {
            let dx = 0;
            if (controls.left) dx -= 1;
            if (controls.right) dx += 1;

            this.x += dx * this.speed * (dt / 1000);
            this.x = Math.max(this.radius + 10, Math.min(canvas.width - this.radius - 10, this.x));

            if (this.boosts.rapid > 0) this.boosts.rapid -= dt;
            if (this.boosts.triple > 0) this.boosts.triple -= dt;
            if (this.invulnerableTimer > 0) this.invulnerableTimer -= dt;

            let currentFireRate = this.boosts.rapid > 0 ? 110 : this.baseFireRate;
            if (controls.shoot && performance.now() - this.lastShot > currentFireRate) {
                this.shoot();
            }
            
            this.updateUI();
        }

        shoot() {
            this.lastShot = performance.now();
            let yPos = this.y - 18;
            
            if (this.boosts.triple > 0) {
                projectiles.push(new Projectile(this.x, yPos, 0));
                projectiles.push(new Projectile(this.x - 14, yPos + 8, -0.2));
                projectiles.push(new Projectile(this.x + 14, yPos + 8, 0.2));
            } else {
                projectiles.push(new Projectile(this.x, yPos, 0));
            }
        }

        takeDamage(amount) {
            if (this.invulnerableTimer > 0) return;
            
            this.hp -= amount;
            this.invulnerableTimer = 600;
            createParticles(this.x, this.y, 18, '#ff3333', 4);
            
            if (this.hp <= 0) {
                endGame();
            }
            this.updateUI();
        }

        heal(amount) {
            this.hp = Math.min(this.maxHp, this.hp + amount);
            createParticles(this.x, this.y, 12, '#00ff00', 3);
            this.updateUI();
        }

        draw() {
            if (this.invulnerableTimer > 0 && Math.floor(performance.now() / 100) % 2 === 0) return;

            ctx.save();
            ctx.translate(this.x, this.y);
            
            // Efek api mesin bawah
            ctx.fillStyle = Math.random() > 0.5 ? '#ff7700' : '#ffea00';
            ctx.beginPath();
            ctx.moveTo(-4, 16);
            ctx.lineTo(4, 16);
            ctx.lineTo(0, 26 + Math.random() * 8);
            ctx.fill();

            // Badan Kapal Tempur
            ctx.shadowBlur = 12;
            ctx.shadowColor = this.color;
            ctx.fillStyle = this.color;
            
            ctx.beginPath();
            ctx.moveTo(0, -22);
            ctx.lineTo(16, 12);
            ctx.lineTo(6, 10);
            ctx.lineTo(-6, 10);
            ctx.lineTo(-16, 12);
            ctx.closePath();
            ctx.fill();
            
            // Kokpit
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.moveTo(0, -10);
            ctx.lineTo(3, 2);
            ctx.lineTo(-3, 2);
            ctx.fill();

            ctx.restore();
        }

        updateUI() {
            textHp.innerText = this.hp;
            let percent = (this.hp / this.maxHp) * 100;
            hpBar.style.width = `${percent}%`;
            
            if(percent > 50) hpBar.style.background = '#00ff00';
            else if(percent > 25) hpBar.style.background = '#ffcc00';
            else hpBar.style.background = '#ff3333';

            let boostTexts = [];
            if(this.boosts.rapid > 0) boostTexts.push(`⚡ Cepat (${Math.ceil(this.boosts.rapid/1000)}d)`);
            if(this.boosts.triple > 0) boostTexts.push(`🔱 Triple (${Math.ceil(this.boosts.triple/1000)}d)`);
            textBoosts.innerText = boostTexts.join(' | ');
        }
    }

    class Projectile {
        constructor(x, y, vx) {
            this.x = x;
            this.y = y;
            this.vx = vx * 400;
            this.vy = -650;
            this.radius = 3.5;
            this.deleteMe = false;
        }
        update(dt) {
            this.x += this.vx * (dt/1000);
            this.y += this.vy * (dt/1000);
            if(this.y < -10 || this.x < -10 || this.x > canvas.width + 10) this.deleteMe = true;
        }
        draw() {
            ctx.fillStyle = '#00ffff';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#00ffff';
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    class Enemy {
        constructor() {
            this.radius = 16;
            this.x = Math.random() * (canvas.width - 60) + 30;
            this.y = -25;
            
            // Variasi musuh berdasarkan level
            let rand = Math.random();
            if (level >= 3 && rand > 0.7) {
                this.type = 'tank';
                this.hp = 4;
                this.speed = 50 + (level * 3);
                this.color = '#aa33ff';
            } else if (level >= 2 && rand > 0.3) {
                this.type = 'weaver';
                this.hp = 2;
                this.speed = 85 + (level * 5);
                this.color = '#33ff66';
                this.swayFreq = 0.003;
                this.swayDist = 45;
                this.startX = this.x;
            } else {
                this.type = 'grunt';
                this.hp = 1;
                this.speed = 70 + (level * 6);
                this.color = '#ff4444';
            }

            this.deleteMe = false;
            this.timeAlive = 0;
        }
        
        update(dt) {
            this.timeAlive += dt;
            this.y += this.speed * (dt/1000);

            if (this.type === 'weaver') {
                this.x = this.startX + Math.sin(this.timeAlive * this.swayFreq) * this.swayDist;
                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
            }

            // KONSEKUENSI: Jika musuh lolos sampai ke bawah layar, HP pemain berkurang
            if (this.y > canvas.height + this.radius) {
                this.deleteMe = true;
                if(player) {
                    player.takeDamage(1);
                    hpBar.parentElement.style.borderColor = '#ff3333';
                    setTimeout(() => hpBar.parentElement.style.borderColor = 'rgba(255, 255, 255, 0.15)', 250);
                }
            }
        }
        
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.strokeStyle = this.color;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 8;
            ctx.shadowColor = this.color;

            if (this.type === 'grunt') {
                ctx.beginPath();
                ctx.moveTo(0, 15);
                ctx.lineTo(13, -12);
                ctx.lineTo(-13, -12);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            } else if (this.type === 'weaver') {
                ctx.beginPath();
                ctx.moveTo(0, 15);
                ctx.lineTo(15, 0);
                ctx.lineTo(8, -15);
                ctx.lineTo(-8, -15);
                ctx.lineTo(-15, 0);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            } else {
                // Tank
                ctx.beginPath();
                ctx.moveTo(0, 20);
                ctx.lineTo(18, 5);
                ctx.lineTo(15, -15);
                ctx.lineTo(-15, -15);
                ctx.lineTo(-18, 5);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            ctx.restore();
        }

        takeDamage() {
            this.hp--;
            if (this.hp <= 0) {
                this.deleteMe = true;
                score += (this.type === 'tank' ? 150 : (this.type === 'weaver' ? 80 : 40));
                textScore.innerText = score;
                
                // Tingkat kesulitan & naik level otomatis berdasarkan skor
                level = Math.floor(score / 500) + 1;

                createParticles(this.x, this.y, 14, this.color, 4);
                
                // Drop Item (Koin / Powerup)
                let roll = Math.random();
                if (roll < 0.3) {
                    collectibles.push(new Collectible(this.x, this.y, 'coin'));
                } else if (roll < 0.36) {
                    collectibles.push(new Collectible(this.x, this.y, 'heal'));
                } else if (roll < 0.42) {
                    collectibles.push(new Collectible(this.x, this.y, 'rapid'));
                } else if (roll < 0.47) {
                    collectibles.push(new Collectible(this.x, this.y, 'triple'));
                }
            }
        }
    }

    class Collectible {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.type = type; // 'coin', 'heal', 'rapid', 'triple'
            this.radius = 11;
            this.speed = 90;
            this.deleteMe = false;
        }
        
        update(dt) {
            this.y += this.speed * (dt/1000);
            if (this.y > canvas.height + 20) this.deleteMe = true;
        }
        
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            if (this.type === 'coin') {
                ctx.fillStyle = '#ffd700';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ffd700';
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#654321';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('¢', 0, 1);
            } else {
                let color = '#fff', char = '';
                if(this.type === 'heal') { color = '#00ff00'; char = '+'; }
                else if(this.type === 'rapid') { color = '#ffcc00'; char = '⚡'; }
                else if(this.type === 'triple') { color = '#00ffff'; char = '🔱'; }
                
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.shadowBlur = 6;
                ctx.shadowColor = color;
                ctx.fillRect(-10, -10, 20, 20);
                ctx.strokeRect(-10, -10, 20, 20);
                
                ctx.fillStyle = color;
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(char, 0, 1);
            }
            ctx.restore();
        }
    }

    class Particle {
        constructor(x, y, color, maxSpeed) {
            this.x = x;
            this.y = y;
            this.color = color;
            this.size = Math.random() * 2.5 + 1;
            let ang = Math.random() * Math.PI * 2;
            let spd = Math.random() * maxSpeed + 1;
            this.vx = Math.cos(ang) * spd;
            this.vy = Math.sin(ang) * spd;
            this.life = 1.0;
            this.decay = Math.random() * 0.02 + 0.015;
            this.deleteMe = false;
        }
        update(dt) {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= this.decay * (dt/16);
            if (this.life <= 0) this.deleteMe = true;
        }
        draw() {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    function createParticles(x, y, count, color, speed) {
        for(let i=0; i<count; i++) particles.push(new Particle(x, y, color, speed));
    }

    function checkCollision(a, b) {
        let dx = a.x - b.x;
        let dy = a.y - b.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        return dist < (a.radius + b.radius) * 0.8;
    }

    // --- UTAMA GAME FLOW & LOOP ---

    function initGame() {
        player = new Player();
        projectiles = [];
        enemies = [];
        particles = [];
        collectibles = [];
        score = 0;
        level = 1;
        coinsCollectedSession = 0;
        frameCount = 0;
        
        textScore.innerText = '0';
        textCoinHud.innerText = GameData.getCoins();
        player.updateUI();

        changeState('PLAYING');
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    function endGame() {
        changeState('GAMEOVER');
        GameData.addCoins(coinsCollectedSession);
        
        document.getElementById('final-score').innerText = score;
        document.getElementById('final-coins').innerText = coinsCollectedSession;
        document.getElementById('main-coin').innerText = GameData.getCoins();
        
        player = null;
    }

    function changeState(newState) {
        gameState = newState;
        uiLayer.classList.add('hidden');
        mainMenu.classList.add('hidden');
        shopMenu.classList.add('hidden');
        gameOverMenu.classList.add('hidden');

        if (newState === 'MENU') {
            document.getElementById('main-coin').innerText = GameData.getCoins();
            mainMenu.classList.remove('hidden');
            if(!animationId) requestAnimationFrame(bgLoop);
        } else if (newState === 'PLAYING') {
            uiLayer.classList.remove('hidden');
        } else if (newState === 'SHOP') {
            openShop();
            shopMenu.classList.remove('hidden');
        } else if (newState === 'GAMEOVER') {
            gameOverMenu.classList.remove('hidden');
        }
    }

    function bgLoop(timestamp) {
        if(gameState === 'PLAYING') return;
        let dt = timestamp - lastTime;
        lastTime = timestamp;
        
        ctx.fillStyle = 'rgba(3, 3, 12, 1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => { s.update(16); s.draw(); });
        animationId = requestAnimationFrame(bgLoop);
    }

    function gameLoop(timestamp) {
        if (gameState !== 'PLAYING') return;

        let dt = timestamp - lastTime;
        lastTime = timestamp;

        ctx.fillStyle = 'rgba(3, 3, 12, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        stars.forEach(s => { s.update(dt); s.draw(); });

        frameCount++;
        // Spawn rate musuh disesuaikan agar santai & mudah dimainkan
        let spawnInterval = Math.max(45, 110 - (level * 8));
        if (frameCount % spawnInterval === 0) {
            enemies.push(new Enemy());
        }

        if (player) {
            player.update(dt);
            player.draw();
        }

        projectiles.forEach(p => { p.update(dt); p.draw(); });
        projectiles = projectiles.filter(p => !p.deleteMe);

        collectibles.forEach(c => {
            c.update(dt);
            c.draw();
            if (player && !c.deleteMe && checkCollision(player, c)) {
                c.deleteMe = true;
                if (c.type === 'coin') {
                    coinsCollectedSession++;
                    textCoinHud.innerText = GameData.getCoins() + coinsCollectedSession;
                } else if (c.type === 'heal') {
                    player.heal(3);
                } else if (c.type === 'rapid') {
                    player.boosts.rapid = 6000;
                } else if (c.type === 'triple') {
                    player.boosts.triple = 6000;
                }
            }
        });
        collectibles = collectibles.filter(c => !c.deleteMe);

        enemies.forEach(e => {
            e.update(dt);
            e.draw();

            if (player && !e.deleteMe && checkCollision(player, e)) {
                e.deleteMe = true;
                player.takeDamage(2);
            }

            projectiles.forEach(p => {
                if (!p.deleteMe && !e.deleteMe && checkCollision(p, e)) {
                    p.deleteMe = true;
                    e.takeDamage();
                }
            });
        });
        enemies = enemies.filter(e => !e.deleteMe);

        particles.forEach(p => { p.update(dt); p.draw(); });
        particles = particles.filter(p => !p.deleteMe);

        animationId = requestAnimationFrame(gameLoop);
    }

    // --- MANAJEMEN TOKO SKIN ---
    function openShop() {
        document.getElementById('shop-coin').innerText = GameData.getCoins();
        const shopList = document.getElementById('shop-list');
        shopList.innerHTML = '';

        const owned = GameData.getOwnedSkins();
        const equipped = GameData.getEquippedSkin();

        for (let key in SKINS) {
            let skin = SKINS[key];
            let isOwned = owned.includes(key);
            let isEquipped = (key === equipped);

            let itemDiv = document.createElement('div');
            itemDiv.className = 'shop-item';

            let btnHtml = '';
            if (isEquipped) {
                btnHtml = `<button class="shop-btn btn-equipped" disabled>Dipakai</button>`;
            } else if (isOwned) {
                btnHtml = `<button class="shop-btn btn-select" onclick="selectSkin('${key}')">Pakai</button>`;
            } else {
                btnHtml = `<button class="shop-btn btn-buy" onclick="buySkin('${key}', ${skin.price})">${skin.price} 🪙</button>`;
            }

            itemDiv.innerHTML = `
                <div class="skin-preview" style="background: ${skin.color};"></div>
                <div class="shop-item-info">
                    <div class="shop-item-name">${skin.name}</div>
                </div>
                ${btnHtml}
            `;
            shopList.appendChild(itemDiv);
        }
    }

    window.buySkin = function(id, price) {
        if (GameData.getCoins() >= price) {
            GameData.addCoins(-price);
            GameData.addSkin(id);
            openShop();
        } else {
            let btn = event.target;
            let ori = btn.innerText;
            btn.innerText = "Kurang!";
            setTimeout(() => btn.innerText = ori, 900);
        }
    };

    window.selectSkin = function(id) {
        GameData.setEquippedSkin(id);
        openShop();
    };

    // --- KONTROL INPUT (KEYBOARD & TOUCH ON-SCREEN BUTTONS) ---

    window.addEventListener('keydown', e => {
        if(e.code === 'ArrowLeft' || e.key === 'a') controls.left = true;
        if(e.code === 'ArrowRight' || e.key === 'd') controls.right = true;
        if(e.code === 'Space') controls.shoot = true;
    });
    window.addEventListener('keyup', e => {
        if(e.code === 'ArrowLeft' || e.key === 'a') controls.left = false;
        if(e.code === 'ArrowRight' || e.key === 'd') controls.right = false;
        if(e.code === 'Space') controls.shoot = false;
    });

    // Pemasangan Event Listener untuk Tombol Sentuh di Layar
    function bindOnScreenButton(id, controlKey) {
        const btn = document.getElementById(id);
        
        const start = (e) => {
            e.preventDefault();
            controls[controlKey] = true;
            btn.classList.add('active');
        };
        const end = (e) => {
            e.preventDefault();
            controls[controlKey] = false;
            btn.classList.remove('active');
        };

        btn.addEventListener('touchstart', start, {passive: false});
        btn.addEventListener('touchend', end, {passive: false});
        btn.addEventListener('mousedown', start);
        window.addEventListener('mouseup', () => {
            controls[controlKey] = false;
            btn.classList.remove('active');
        });
    }

    bindOnScreenButton('btn-left', 'left');
    bindOnScreenButton('btn-right', 'right');
    bindOnScreenButton('btn-shoot', 'shoot');

    // Hubungkan Tombol Navigasi Menu
    document.getElementById('start-btn').addEventListener('click', initGame);
    document.getElementById('restart-btn').addEventListener('click', initGame);
    document.getElementById('shop-btn-main').addEventListener('click', () => changeState('SHOP'));
    document.getElementById('shop-back-btn').addEventListener('click', () => changeState('MENU'));
    document.getElementById('main-menu-btn').addEventListener('click', () => changeState('MENU'));

    // Jalankan Starfield Menu Awal
    for(let i=0; i<100; i++) stars.push(new Star());
    changeState('MENU');

</script>
